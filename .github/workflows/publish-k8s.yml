name: Publish Kubernetes fork images

on:
  workflow_dispatch:
  push:
    branches:
      - kubernetes-support

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: beszel
            dockerfile: ./internal/dockerfile_hub
          - image: beszel-agent
            dockerfile: ./internal/dockerfile_agent
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install site dependencies
        run: bun install --no-save --cwd ./internal/site

      - name: Build site
        run: bun run --cwd ./internal/site build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/laurensbosscher/${{ matrix.image }}:k8s
            ghcr.io/laurensbosscher/${{ matrix.image }}:sha-${{ github.sha }}

      - name: Make package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          for endpoint in \
            "/user/packages/container/${{ matrix.image }}" \
            "/users/${{ github.repository_owner }}/packages/container/${{ matrix.image }}"
          do
            gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "$endpoint" \
              -f visibility='public' && exit 0
          done
          exit 1

      - name: Export image archive
        run: |
          image="ghcr.io/laurensbosscher/${{ matrix.image }}"
          docker pull "$image:sha-${{ github.sha }}"
          docker tag "$image:sha-${{ github.sha }}" "$image:k8s"
          docker save -o "${{ matrix.image }}.tar" "$image:sha-${{ github.sha }}" "$image:k8s"

      - name: Upload image archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image }}
          path: ${{ matrix.image }}.tar
          retention-days: 7

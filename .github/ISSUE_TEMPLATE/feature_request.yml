name: 🚀 Feature request
description: Request a new feature or change.
title: "[Feature]: "
labels: ["enhancement", "needs-review"]
body:
  - type: checkboxes
    attributes:
      label: Welcome!
      description: |
        The issue tracker is for reporting bugs and feature requests only. For end-user related support questions, please use the **[GitHub Discussions](https://github.com/henrygd/beszel/discussions)** instead

        Please note:
        - For **Bug reports**, use the [Bug Form](https://github.com/henrygd/beszel/issues/new?template=bug_report.yml).
        - Any requests for new translations should be requested within the [crowdin project](https://crowdin.com/project/beszel).
        - Create one issue per feature request. This helps us keep track of requests and prioritize them accordingly.
        - Feature requests that don't follow this template (for example, removed sections or vague descriptions) may be closed without review.

      options:
      - label: I have searched open and closed feature requests to make sure this or similar feature request does not already exist.
        required: true
      - label: This is a feature request, not a bug report or support question.
        required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Beszel is this about?
      options:
        - Hub
        - Agent
        - Hub & Agent
      default: 0
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Problem / Use Case
      description: |
        What problem are you trying to solve, or what can't you do today? Describe your situation, not the solution.
      placeholder: |
        - What are you trying to do?
        - What's missing or getting in the way today?
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Proposed Solution
      description: |
        How should the feature work? Describe what it does and where it shows up (hub UI, agent, alerts, etc.).
        **Important:** Be specific and detailed. Vague requests like "make it better" will be closed.
      placeholder: |
        - What should the feature do?
        - Where would you see or configure it?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you tried any workarounds or other ways to solve this? (optional)

  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to implement this?
      description: If yes, please wait until the request has been reviewed before opening a pull request.
      options:
        - "Yes"
        - "No"
        - Maybe, with some guidance
    validations:
      required: true

  - type: checkboxes
    id: review
    attributes:
      label: Before opening a pull request
      description: New feature requests get the `needs-review` label. A maintainer removes it once the request has been reviewed and accepted.
      options:
        - label: I understand that nobody should open a pull request for this request while the `needs-review` label is applied.
          required: true
# Drop-in: /etc/systemd/system/beszel-agent.service.d/apply.conf
#
# Keep User=beszel (NOT root). Settings that imply NoNewPrivileges must be off
# so passwordless sudo can run the constrained helper.
# Install helper: /usr/local/lib/beszel/beszel-pkg-apply
# Install sudoers: /etc/sudoers.d/beszel-agent-apply
[Service]
User=beszel
Group=beszel
Environment=PACKAGE_UPDATES_APPLY=true
# Optional automatic apply after checks. Values: security | all | false
# Leave unset/false and use the hub UI Auto-apply dropdown, or set explicitly:
# Environment=PACKAGE_UPDATES_AUTO_APPLY=security
# Environment=PACKAGE_UPDATES_AUTO_APPLY_INTERVAL=24h

# Required so sudo -n helper works (these imply NoNewPrivileges when enabled)
NoNewPrivileges=false
RestrictSUIDSGID=false
ProtectHostname=false
ProtectClock=false
ProtectKernelLogs=false
LockPersonality=false
# Allow package managers to modify the system via sudo helper
ProtectSystem=false
ProtectHome=read-only
RemoveIPC=false
KeyringMode=private
